<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foto a 3D</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#1c1c1e;--mut:#6b6b70;--card:#f2f2f5;--ac:#5b4bdb;--bad:#c0392b;--ok:#1e8e4e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#f0f0f3;--mut:#9a9aa2;--card:#26262b;--ac:#8f82ff;--bad:#ff7b6b;--ok:#4cd388}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:1.3rem;margin:0 0 4px}p.s{color:var(--mut);margin:0 0 14px;font-size:.9rem}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0;font-size:.92rem}
input[type=number]{width:84px;padding:6px;border-radius:8px;border:1px solid var(--mut);background:var(--bg);color:var(--fg);font-size:1rem}
input[type=range]{flex:1;max-width:200px}
button,.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font-size:1rem;font-weight:600;text-align:center;cursor:pointer;box-sizing:border-box}
button:disabled{opacity:.4}
canvas{width:100%;border-radius:10px;background:#000;display:block}
#info{font-size:.9rem;margin-top:8px}.bad{color:var(--bad)}.ok{color:var(--ok)}
h2{font-size:1rem;margin:0 0 6px}
</style></head><body><main>
<h1>Foto → relieve 3D</h1>
<p class="s">Convierte una imagen en un relieve (tipo litofanía o placa en relieve) y descárgalo como STL.</p>
<div class="card"><input id="f" type="file" accept="image/*" style="width:100%"></div>
<div class="card"><canvas id="cv" width="300" height="200"></canvas><div id="info"></div></div>
<div class="card"><h2>Forma</h2>
<label>Ancho (mm)<input id="w" type="number" value="80" min="5"></label>
<label>Relieve máx. (mm)<input id="rh" type="number" value="4" min="0.2" step="0.1"></label>
<label>Base (mm)<input id="bs" type="number" value="1.5" min="0.4" step="0.1"></label>
<label>Detalle<input id="res" type="range" min="40" max="300" value="160"></label>
<label>Suavizado<input id="sm" type="range" min="0" max="4" value="1"></label>
<label>Invertir (claro = bajo)<input id="inv" type="checkbox"></label></div>
<div class="card"><h2>Volumen de impresión (mm)</h2>
<p class="s" style="margin:0 0 6px">Revisa estos valores en el manual de tu Halot R6.</p>
<label>X<input id="vx" type="number" value="228"></label>
<label>Y<input id="vy" type="number" value="128"></label>
<label>Z<input id="vz" type="number" value="230"></label>
<button id="fit" style="margin-top:8px;background:var(--mut)">Ajustar al volumen</button></div>
<button id="dl" disabled>Descargar (.zip con el STL)</button>
</main>
<script>
const $=id=>document.getElementById(id);
let img=null,H=null,C=0,R=0;
const cv=$('cv'),cx=cv.getContext('2d');
$('f').onchange=e=>{const fl=e.target.files[0];if(!fl)return;const im=new Image();im.onload=()=>{img=im;update()};im.src=URL.createObjectURL(fl)};
['w','rh','bs','res','sm','inv','vx','vy','vz'].forEach(i=>$(i).oninput=update);
function dims(){const w=+$('w').value;return{X:w,Y:C>1?w*(R-1)/(C-1):0,Z:+$('bs').value+ +$('rh').value}}
function update(){
  if(!img)return;
  C=+$('res').value;R=Math.max(2,Math.round(C*img.height/img.width));
  const t=document.createElement('canvas');t.width=C;t.height=R;
  const c=t.getContext('2d');c.drawImage(img,0,0,C,R);
  const d=c.getImageData(0,0,C,R).data;
  let h=new Float32Array(C*R);
  for(let i=0;i<C*R;i++){let v=(0.299*d[i*4]+0.587*d[i*4+1]+0.114*d[i*4+2])/255;h[i]=$('inv').checked?1-v:v}
  for(let p=0;p<+$('sm').value;p++){const n=new Float32Array(h);
    for(let j=1;j<R-1;j++)for(let i=1;i<C-1;i++){let s=0;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)s+=h[(j+a)*C+i+b];n[j*C+i]=s/9}
    h=n}
  H=h;
  cv.width=C;cv.height=R;
  const o=cx.createImageData(C,R);
  for(let i=0;i<C*R;i++){const g=h[i]*255;o.data[i*4]=o.data[i*4+1]=o.data[i*4+2]=g;o.data[i*4+3]=255}
  cx.putImageData(o,0,0);
  check();$('dl').disabled=false;
}
function check(){
  const D=dims(),vx=+$('vx').value,vy=+$('vy').value,vz=+$('vz').value;
  const ok=D.X<=vx&&D.Y<=vy&&D.Z<=vz;
  $('info').innerHTML=`Tamaño: ${D.X.toFixed(1)} × ${D.Y.toFixed(1)} × ${D.Z.toFixed(1)} mm — <span class="${ok?'ok':'bad'}">${ok?'cabe en la impresora':'no cabe'}</span>`;
}
$('fit').onclick=()=>{if(!img)return;const vx=+$('vx').value,vy=+$('vy').value,vz=+$('vz').value;
  const ratio=(R-1)/(C-1);let w=Math.min(vx,vy/ratio);$('w').value=Math.floor(w*10)/10;
  if(dims().Z>vz)$('rh').value=Math.max(.2,vz-+$('bs').value);check()};
const crcT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=crcT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
function zip(name,u8){const nm=new TextEncoder().encode(name),crc=crc32(u8),n=u8.length,L=nm.length;
  const out=new Uint8Array(30+L+n+46+L+22),v=new DataView(out.buffer),c=30+L+n,e=c+46+L;
  v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(12,33,true);v.setUint32(14,crc,true);v.setUint32(18,n,true);v.setUint32(22,n,true);v.setUint16(26,L,true);
  out.set(nm,30);out.set(u8,30+L);
  v.setUint32(c,0x02014b50,true);v.setUint16(c+4,20,true);v.setUint16(c+6,20,true);v.setUint16(c+14,33,true);v.setUint32(c+16,crc,true);v.setUint32(c+20,n,true);v.setUint32(c+24,n,true);v.setUint16(c+28,L,true);v.setUint32(c+42,0,true);
  out.set(nm,c+46);
  v.setUint32(e,0x06054b50,true);v.setUint16(e+8,1,true);v.setUint16(e+10,1,true);v.setUint32(e+12,46+L,true);v.setUint32(e+16,c,true);
  return out}
$('dl').onclick=async()=>{
  const D=dims(),s=D.X/(C-1),rh=+$('rh').value,bs=+$('bs').value;
  const P=(i,j)=>[i*s,(R-1-j)*s,bs+H[j*C+i]*rh];
  const B=(i,j)=>[i*s,(R-1-j)*s,0];
  const tris=[];
  for(let j=0;j<R-1;j++)for(let i=0;i<C-1;i++){
    const a=P(i,j),b=P(i+1,j),c=P(i,j+1),d=P(i+1,j+1);
    tris.push([a,d,b],[a,c,d]);
    const A=B(i,j),Bb=B(i+1,j),Cc=B(i,j+1),Dd=B(i+1,j+1);
    tris.push([A,Bb,Dd],[A,Dd,Cc]);
  }
  const path=[];
  for(let i=0;i<C-1;i++)path.push([i,0]);
  for(let j=0;j<R-1;j++)path.push([C-1,j]);
  for(let i=C-1;i>0;i--)path.push([i,R-1]);
  for(let j=R-1;j>0;j--)path.push([0,j]);
  for(let k=0;k<path.length;k++){
    const [i1,j1]=path[k],[i2,j2]=path[(k+1)%path.length];
    const t1=P(i1,j1),t2=P(i2,j2),b1=B(i1,j1),b2=B(i2,j2);
    tris.push([t1,t2,b1],[t2,b2,b1]);
  }
  const buf=new ArrayBuffer(84+tris.length*50),v=new DataView(buf);
  v.setUint32(80,tris.length,true);
  tris.forEach((t,n)=>{
    const o=84+n*50,u=[t[1][0]-t[0][0],t[1][1]-t[0][1],t[1][2]-t[0][2]],w=[t[2][0]-t[0][0],t[2][1]-t[0][1],t[2][2]-t[0][2]];
    let nx=u[1]*w[2]-u[2]*w[1],ny=u[2]*w[0]-u[0]*w[2],nz=u[0]*w[1]-u[1]*w[0];
    const l=Math.hypot(nx,ny,nz)||1;
    [nx/l,ny/l,nz/l].forEach((q,k)=>v.setFloat32(o+k*4,q,true));
    t.forEach((p,k)=>p.forEach((q,m)=>v.setFloat32(o+12+k*12+m*4,q,true)));
  });
  try{const dm=window.claude&&claude.use?await claude.use('downloads'):null;
    if(dm){await dm.save({filename:'relieve.zip',data:new Blob([zip('relieve.stl',new Uint8Array(buf))],{type:'application/zip'})});return}
  }catch(err){if(err&&err.code==='declined')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([buf],{type:'model/stl'}));
  a.download='relieve.stl';a.click();
};
</script></body></html>
